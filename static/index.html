<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const chips = ["Java", "Python", "RAG", "Agent", "MySQL", "Git"];
$("#chips").innerHTML = chips.map(t => `<span class="chip">${esc(t)}</span>`).join("");

$("#skills-list").innerHTML = (SITE.profile.skills || []).map(g => `
  <div class="skill-group">
    <div class="g">${esc(g.group)}</div>
    <div class="tags">${(g.items || []).map(i => `<span class="tag">${esc(i)}</span>`).join("")}</div>
  </div>`).join("");

$("#edu").innerHTML = (SITE.profile.education || []).map(e => `
  <div class="row">
    <div class="period">${esc(e.period)}</div>
    <div><b>${esc(e.school)}</b> · ${esc(e.major)} · ${esc(e.degree)}</div>
  </div>`).join("");

$("#projects-grid").innerHTML = (SITE.projects || []).map((p, i) => `
  <article class="card" data-i="${i}">
    <h3>${esc(p.name)}</h3>
    <div class="meta">${esc(p.role || "")}${p.period ? " · " + esc(p.period) : ""}</div>
    <div class="desc">${esc(p.summary)}</div>
    <div class="tags">${(p.tech || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
  </article>`).join("");

$("#awards-list").innerHTML = (SITE.awards || []).map(a => `
  <div class="award">
    <div class="year">${esc(a.year || "")}</div>
    <div>${esc(a.title)}${a.org ? `<span class="muted"> · ${esc(a.org)}</span>` : ""}</div>
  </div>`).join("");

$("#contact-list").innerHTML = [
  SITE.profile.email ? `<a href="mailto:${esc(SITE.profile.email)}">${esc(SITE.profile.email)}</a>` : "",
  SITE.profile.phone ? `<span>${esc(SITE.profile.phone)}</span>` : "",
  SITE.profile.location ? `<span>${esc(SITE.profile.location)}</span>` : "",
  `<a href="https://github.com/jiang1381" target="_blank" rel="noopener">github.com/jiang1381</a>`,
  `<a href="https://jiangchenmoonchoi0908.dpdns.org/" target="_blank" rel="noopener">在线作品集</a>`,
].filter(Boolean).join("");

$("#projects-grid").addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (card) openProject(Number(card.dataset.i));
});

let shots = [], lbIndex = 0;

function openProject(i) {
  const p = SITE.projects[i];
  shots = (p.screenshots || []).map(s => `assets/${p.id}/${s.name}`);
  const gallery = shots.length
    ? `<div class="gal">${shots.map((src, j) =>
        `<img loading="lazy" src="${src}" data-j="${j}" alt="${esc(p.name)} 截图">`).join("")}</div>`
    : `<p class="muted">该项目暂无运行截图</p>`;
  $("#pmBox").innerHTML = `
    <button class="pm-close" onclick="closeProject()">×</button>
    <h2>${esc(p.name)}</h2>
    <div class="meta">${esc(p.role || "")}${p.period ? " · " + esc(p.period) : ""}</div>
    <p class="summary">${esc(p.summary)}</p>
    ${(p.highlights || []).length ? `<h4>技术要点</h4><ul>${p.highlights.map(h => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}
    ${(p.results || []).length ? `<h4>成果</h4><ul>${p.results.map(h => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}
    ${shots.length ? `<h4>运行截图</h4>${gallery}` : ""}
  `;
  $("#pm").classList.add("open");
}

function closeProject() {
  $("#pm").classList.remove("open");
}

function openLb(j) {
  lbIndex = j;
  showLb();
}

function showLb() {
  $("#lbImg").src = shots[lbIndex];
  $("#lbCount").textContent = `${lbIndex + 1} / ${shots.length}`;
  $("#lb").classList.add("open");
}

function closeLb() {
  $("#lb").classList.remove("open");
}

function lbStep(step) {
  if (!shots.length) return;
  lbIndex = (lbIndex + step + shots.length) % shots.length;
  showLb();
}

document.addEventListener("click", (e) => {
  const img = e.target.closest(".gal img");
  if (img) openLb(Number(img.dataset.j));
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeLb(); closeProject(); }
  if (e.key === "ArrowLeft") lbStep(-1);
  if (e.key === "ArrowRight") lbStep(1);
});
</script>
</body>
</html>
